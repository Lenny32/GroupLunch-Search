<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Fixture Site</title>
  <style>
    body { font-family: Arial, sans-serif; }
    #result { margin-top: 20px; color: #0a0; }
  </style>
</head>
<body>
  <h1>Welcome</h1>
  <p>Click the button to reveal the data.</p>
  <button id="reveal">Reveal</button>
  <div id="result"></div>

  <script>
    document.getElementById('reveal').addEventListener('click', () => {
      document.getElementById('result').textContent = 'Result: OK';
    });
  </script>
</body>
</html>
